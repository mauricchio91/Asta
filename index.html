<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080b0f; --panel:#111820; --sunk:#0b1016; --line:#1c2733; --line2:#2a3947;
  --txt:#e6edf3; --dim:#8b9cad; --dim2:#5a6b7c;
  --P:#e8a33d; --D:#56b870; --C:#4a90d9; --A:#d6544e;
  --ok:#2bb673; --warn:#d9a21b; --bad:#dc4c4c; --key:#7cc4d8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.45 var(--sans);
  padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto;padding:0 12px}
button,input,select,textarea,.it,.card{font-family:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);line-height:1.3}

/* ---------------------------------------------------------------- header */
header{position:sticky;top:0;z-index:30;background:rgba(8,11,15,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:9px 12px 5px;text-align:center}
.hstats b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.spend{height:3px;display:flex;gap:1px;margin:0 12px 7px}
.spend i{display:block;height:100%;border-radius:2px;opacity:.85}
.spend .rest{background:var(--line2);opacity:1;flex:1}
.tabs{display:flex;gap:3px;padding:0 12px 8px;overflow-x:auto}
.tabs button{flex:0 0 auto;border-radius:7px;padding:7px 13px;font-size:14px;font-weight:600;
  background:var(--line);color:var(--dim)}
.tabs button.on{background:var(--txt);color:var(--bg)}
.tabs .undo{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--dim)}
.tabs .undo:disabled{opacity:.28}

/* ------------------------------------------------------------------ list */
.search{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:11px;
  padding:14px 16px;font-size:17px}
.search::placeholder{color:var(--dim2)}
.chips{display:flex;gap:4px;margin:9px 0 0}
.chips button{border-radius:7px;padding:6px 13px;font-size:12px;font-weight:800;letter-spacing:.03em;
  background:var(--line);color:var(--dim)}
.chips button.on{color:var(--bg)}
.chips button[data-r=P].on{background:var(--P)}.chips button[data-r=D].on{background:var(--D)}
.chips button[data-r=C].on{background:var(--C)}.chips button[data-r=A].on{background:var(--A)}
.chips button[data-r=tutti].on{background:var(--txt)}
.list{margin-top:11px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left;
  border-top:1px solid var(--line);background:var(--panel);font-size:15px;
  /* le righe fuori schermo non vengono calcolate né disegnate: altezza costante,
     quindi basta un valore fisso e la barra di scorrimento non salta */
  content-visibility:auto;contain-intrinsic-size:auto 57px}
.it:first-child{border-top:0}
.it:active{background:var(--line)}
.badge{width:22px;height:22px;flex:0 0 auto;border-radius:5px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:var(--bg)}
.b-P{background:var(--P)}.b-D{background:var(--D)}.b-C{background:var(--C)}.b-A{background:var(--A)}
.it .nm{flex:1;min-width:0}
.it .nm b{font-weight:600}
.it .tm{color:var(--dim2);font-size:13px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.off{background:var(--line2)}
.it .val{text-align:right;flex:0 0 auto}
.it .val b{display:block;font-family:var(--mono);font-size:16px;color:var(--key);line-height:1.1}
.it.gone{background:var(--sunk);color:var(--dim2);cursor:default}
.it.gone .badge{background:var(--line2);color:var(--dim2)}
.gonelbl{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--bad)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--sunk);border-radius:7px;padding:11px 12px;font-size:14px}
.sw input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--ok)}
.trend{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);
  border-radius:9px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--dim)}
.trend b{color:var(--txt)}
.dotq{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.autobox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px;text-align:center}
.autobox div{background:var(--sunk);border-radius:7px;padding:8px 3px}
.autobox b{display:block;font-family:var(--mono);font-size:17px;line-height:1.15}
.trend{align-items:flex-start;line-height:1.5}
.calib{background:var(--sunk);border-radius:9px;padding:10px;margin-bottom:8px}
.crow{display:flex;align-items:center;gap:7px}
.cname{flex:1;font-size:14px;font-weight:600}
.crow button{width:44px;height:38px;border-radius:7px;background:var(--line);font-size:14px;font-weight:700}
.crow button:active{background:var(--line2)}
.cval{width:52px;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--key)}
.cprev{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--dim2)}
.cprev b{font-family:var(--mono);color:var(--txt);font-size:13px}
.ctrend{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;color:var(--dim2)}
.topbox{display:flex;align-items:center;gap:8px}
.topbox button{flex:0 0 auto;width:64px;height:54px;border-radius:8px;background:var(--line);
  font-size:17px;font-weight:700}
.topbox button:active{background:var(--line2)}
.topval{flex:1;text-align:center;background:var(--sunk);border-radius:8px;padding:7px 4px}
.topval b{display:block;font-family:var(--mono);font-size:26px;font-weight:700;color:var(--key);line-height:1.1}
.preset{display:flex;gap:6px;margin-top:8px}
.preset button{flex:1;border:1px solid var(--line2);border-radius:7px;padding:8px 4px;
  font-size:12px;font-weight:600;color:var(--dim);line-height:1.25}
.preset button.on{border-color:var(--key);color:var(--key);background:rgba(124,196,216,.09)}
.esempi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.esempi div{background:var(--sunk);border-radius:7px;padding:8px 3px}
.esempi b{display:block;font-family:var(--mono);font-size:19px;color:var(--txt);line-height:1.15}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cfg label{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--sunk);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--dim)}
.cfg input{width:64px;background:var(--panel);border:1px solid var(--line2);border-radius:5px;
  padding:5px 6px;text-align:right;font-family:var(--mono);font-size:16px}
.bk{width:100%;height:80px;background:var(--sunk);border:1px solid var(--line2);border-radius:7px;
  padding:9px;font-family:var(--mono);font-size:10px;color:var(--dim);resize:none}
.taken{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--ok);
  border:1px solid var(--ok);border-radius:4px;padding:0 4px}
.count{padding:9px 12px;background:var(--sunk);font-size:12px;color:var(--dim2);
  border-bottom:1px solid var(--line)}
.count button{color:var(--key);font-size:12px;font-weight:700;padding:0}
.more{color:var(--key);font-size:13px;font-weight:700;padding:0}
.none{padding:26px 14px;text-align:center;color:var(--dim2);font-size:14px}

/* ---------------------------------------------------------------- detail */
.back{color:var(--dim);font-size:14px;padding:5px 2px;margin-bottom:4px}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px 12px 0 0;padding:15px}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hd h2{margin:0;font-size:25px;line-height:1.1;letter-spacing:-.02em}
.hd .meta{color:var(--dim);font-size:13.5px;margin:3px 0 0}
.star{font-size:23px;line-height:1;padding:0 3px;color:var(--line2)}
.star.on{color:var(--key)}
.flag{margin-top:12px;padding:9px 11px;border-radius:7px;font-size:13.5px;
  background:#3a1d10;border:1px solid #7c3d16;color:#f5c98a}
.flag.red{background:#3a1213;border-color:#7c1d1f;color:#f0a0a2}

/* statistiche */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:13px;text-align:center}
.stats div{background:var(--sunk);border-radius:7px;padding:7px 2px}
.stats b{display:block;font-family:var(--mono);font-size:16px;line-height:1.2}

/* righello dei prezzi: l'elemento centrale */
.ruler{margin-top:16px}
.rtrack{position:relative;height:38px;background:var(--sunk);border-radius:8px;overflow:hidden}
.rband{position:absolute;top:0;bottom:0;background:rgba(124,196,216,.16);
  border-left:1px solid rgba(124,196,216,.35);border-right:1px solid rgba(124,196,216,.35)}
.rcap{position:absolute;top:0;bottom:0;width:2px;background:var(--key)}
.rmax{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.65}
.rbid{position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:2px;background:var(--txt);
  box-shadow:0 0 0 3px var(--bg)}
.rbid.ok{background:var(--ok)}.rbid.warn{background:var(--warn)}.rbid.bad{background:var(--bad)}
.rlegend{display:flex;justify-content:space-between;margin-top:6px;gap:8px}
.rlegend span{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim2)}
.rlegend b{font-family:var(--mono);color:var(--dim);font-size:11px;text-transform:none;letter-spacing:0}

.notes{display:grid;gap:5px;margin-top:13px}
.note{background:var(--sunk);border-radius:7px;padding:9px 11px;font-size:12.5px;color:var(--dim)}
.note b{color:var(--txt)}
.note.gk{border:1px solid var(--line2)}

/* verdetto */
.verdict{padding:14px 15px;display:flex;flex-wrap:wrap;align-items:baseline;
  justify-content:space-between;gap:3px 12px}
.verdict b{font-size:27px;font-weight:800;letter-spacing:-.03em}
.verdict span{font-size:13px;font-weight:600;opacity:.82}
.v-ok{background:var(--ok);color:#04231a}
.v-warn{background:var(--warn);color:#2e2103}
.v-bad{background:var(--bad);color:#fff}
.v-off{background:var(--line2);color:var(--txt)}

.bidbox{background:var(--panel);border:1px solid var(--line2);border-top:0;
  border-radius:0 0 12px 12px;padding:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:58px;flex:0 0 auto;border-radius:8px;background:var(--line);
  font-size:18px;font-weight:700}
.step button:active{background:var(--line2)}
.step input{flex:1;min-width:0;height:58px;background:var(--sunk);border:1px solid var(--line2);
  border-radius:8px;text-align:center;font-family:var(--mono);font-size:28px;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button{border-radius:10px;padding:17px 4px;font-size:16px;font-weight:800;line-height:1.15}
.acts .mine{background:var(--ok);color:#04231a}
.acts .mine:disabled{opacity:.3}
.acts .other{background:var(--line2);font-weight:700}

/* ------------------------------------------------------------------ card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:11px;
  /* le schede hanno altezze molto diverse: con "auto" il browser ricorda quella
     reale dopo la prima misura, evitando gli scatti della barra di scorrimento */
  content-visibility:auto;contain-intrinsic-size:auto 160px}
.card h3{margin:0 0 9px;font-size:16px;letter-spacing:-.01em}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.rhead .lft{display:flex;align-items:center;gap:8px}
.rhead .n{font-family:var(--mono);font-size:14px}
.rhead input{width:62px;background:var(--sunk);border:1px solid var(--line2);border-radius:5px;
  padding:3px 6px;text-align:right;font-family:var(--mono);font-size:16px}
.bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%}
.ln{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.ln .g{flex:1;min-width:0}
.ln .mv{font-family:var(--mono);font-size:12px;color:var(--dim2)}
.ln .p{font-family:var(--mono);color:var(--dim)}
.ln .x{color:var(--dim2);font-size:16px;padding:0 3px}
.slot{padding:7px 0;border-top:1px dashed var(--line2);font-size:14px;color:var(--dim2)}
.mod .big{font-size:38px;font-weight:800;color:var(--key);line-height:1.05;margin:3px 0;letter-spacing:-.03em}
.tiny{font-size:11.5px;color:var(--dim2);line-height:1.55}
.band{margin-bottom:11px}
.band .h{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.band .b{font-size:14px;color:#c3d0da;line-height:1.75}
.band .b button{color:#c3d0da;font-size:14px;padding:0}
.band .b .q{font-family:var(--mono);font-size:11px;color:var(--dim2)}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  opacity:1;transition:opacity .45s ease}
#splash.via{opacity:0;pointer-events:none}
.sp-in{text-align:center;max-width:320px;width:100%}
.sp-logo{width:96px;height:96px;display:block;margin:0 auto 22px;
  fill:none;stroke:var(--D);stroke-width:7;stroke-linejoin:round}
.sp-t{font-size:30px;font-weight:800;letter-spacing:.18em;color:var(--txt);line-height:1}
.sp-s{margin-top:9px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.sp-r{margin-top:26px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
/* la barra usa i colori dei ruoli, gli stessi dei badge nell'elenco */
.sp-r i{display:block;height:100%;width:40%;border-radius:2px;
  background:linear-gradient(90deg,var(--P),var(--D),var(--C),var(--A));
  animation:sp-go 1.1s ease-in-out infinite}
@keyframes sp-go{0%{transform:translateX(-105%)}100%{transform:translateX(255%)}}
@media(prefers-reduced-motion:reduce){
  #splash{transition:none}
  .sp-r i{animation:none;width:100%}
}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);z-index:60;
  display:flex;flex-direction:column;gap:6px;padding:0 12px;pointer-events:none}
.toast{pointer-events:auto;background:var(--panel);border:1px solid var(--line2);
  border-left:3px solid var(--key);border-radius:9px;padding:10px 12px;font-size:12.5px;
  line-height:1.4;color:var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:flex;gap:8px;align-items:flex-start;max-width:520px;width:100%;margin:0 auto}
.toast.warn{border-left-color:var(--amb)}
.toast b{display:block;margin-bottom:2px}
.toast button{flex:0 0 auto;background:0;border:0;color:var(--dim2);font-size:16px;
  line-height:1;padding:0 2px}
.wrapoverlay{position:fixed;inset:0;z-index:70;background:rgba(2,6,15,.88);
  display:flex;align-items:center;justify-content:center;padding:16px}
.wrapsheet{width:100%;max-width:360px}

.danger{width:100%;padding:14px;border-radius:11px;border:1px solid #6e1f22;color:#e07a7c;
  font-size:14px;font-weight:600}
.pairs{display:grid;gap:5px}
.pair{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:7px;padding:9px 11px;font-size:14px}
.pair .q{width:26px;height:26px;flex:0 0 auto;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--bg)}
.pair .g{flex:1;min-width:0}
.pair .lbl{font-size:11px;color:var(--dim2)}
.sel{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:8px;
  padding:11px;font-size:16px;margin-bottom:11px}
.guide p{color:#c3d0da;font-size:14px;margin:0}
.guide h3{color:var(--key)}
/* titolarità, calci piazzati, etichette */
.it .nm{line-height:1.3}
.tit{font-size:11.5px;font-weight:600}
.sp{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:4px;
  padding:0 3px;margin-left:5px;vertical-align:1px}
.inj{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;
  color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:0 4px;
  margin-left:5px;vertical-align:1px;white-space:nowrap}

var qTimer = null;     // attesa prima di rifiltrare la ricerca
var buyLock = false;   // impedisce che un doppio tocco registri due acquisti

/* Avvisi proattivi ("spia"): stato solo di interfaccia, non persistito.
   Un avviso compare una volta sola per chiave; chiuderlo non lo fa ripresentare
   nella stessa sessione. Niente timer di scadenza: un intervallo periodico
   forzerebbe un render al secondo, il contrario di quanto ottimizzato prima. */
var toasts = [], toastSeen = {};
var TOAST_MAX = 3;
function toastPush(key, title, body, tone) {
  if (toastSeen[key]) return;
  toastSeen[key] = true;
  toasts.push({ key: key, title: title, body: body, tone: tone || "" });
  /* Sul telefono più di tre avvisi coprono l'interfaccia proprio quando serve
     guardarla: tengo i più recenti, che sono anche i più attuali. */
  while (toasts.length > TOAST_MAX) toasts.shift();
}
function toastsHTML() {
  if (!toasts.length) return "";
  return '<div id="toasts">' + toasts.map(function (t) {
    return '<div class="toast ' + t.tone + '"><span style="flex:1"><b>' + t.title + "</b>" +
      t.body + '</span><button onclick="_a.toastClose(\'' + t.key +
      '\')" aria-label="Chiudi">✕</button></div>';
  }).join("") + "</div>";
}
/* Confronta il mio reparto con quello di tutti gli 11 rivali: derivato dagli
   acquisti già registrati (S.market), nessuno stato nuovo da mantenere. */
function checkAlerts(d) {
  ROLES.forEach(function (rr) {
    if (d.per[rr.k].need <= 0) return;
    var tuttiPieni = d.riv.every(function (r) {
      var presi = r.ids.filter(function (id) { return BY_ID[id].r === rr.k; }).length;
      return S.cfg.sl[rr.k] - presi <= 0;
    });
    if (tuttiPieni) toastPush("late:" + rr.k, "Reparto in ritardo",
      "Ti mancano ancora " + d.per[rr.k].need + " " + rr.l.toLowerCase() +
      ": gli altri hanno già chiuso il reparto. Qui puoi aspettare, i prezzi tendono a scendere.");
  });
  /* Ritmo di spesa. Se riempi gli slot molto più in fretta di quanto spendi,
     finirai l'asta con la cassa piena e una rosa scadente: i crediti avanzati
     valgono zero. Va misurato mentre l'asta scorre, non alla fine, quando non
     c'è più modo di rimediare. Confronto la quota di rosa completata con la
     quota di budget usata: se divergono di oltre un quarto, lo dico. */
  var tot = SLOTS(), riempiti = tot - d.left;
  if (riempiti >= 5 && d.left > 0 && tot > 0 && S.cfg.credits > 0) {
    var qSlot = riempiti / tot, qSpesa = d.spent / S.cfg.credits;
    var scarto = qSlot - qSpesa;
    var passo = Math.floor(Math.abs(scarto) * 10);
    if (scarto > 0.25)
      toastPush("lento:" + passo, "Stai comprando troppo a buon mercato",
        "Rosa completata al " + Math.round(qSlot * 100) + "% ma hai speso solo il " +
        Math.round(qSpesa * 100) + "% dei crediti. Di questo passo ne avanzeranno " +
        "molti, e a fine asta valgono zero: alza le offerte sui giocatori che contano.",
        "warn");
    else if (scarto < -0.25)
      toastPush("veloce:" + passo, "Stai spendendo troppo in fretta",
        "Hai speso il " + Math.round(qSpesa * 100) + "% dei crediti per il " +
        Math.round(qSlot * 100) + "% della rosa. Restano " + d.left +
        " slot con " + d.credits + " crediti: da qui in avanti dovrai accontentarti.",
        "warn");
  }

  d.riv.forEach(function (r) {
    if (r.slots <= 0 || r.credits > 15) return;
    /* una volta sola per rivale: usando fasce di crediti l'avviso si ripeteva
       a ogni scalino e a fine asta se ne accumulavano decine sullo schermo */
    toastPush("poor:" + r.i, esc(r.name) + " è al verde",
      "Le restano " + r.credits + " crediti per " + r.slots +
      " slot: non può più competere per un giocatore sopra quella cifra.", "warn");
  });
}

var wrappedOpen = false;   // il riepilogo di fine asta è un overlay, non una scheda in più
var openBand = {};     // fasce espanse nella scheda "chi resta"

/* ---------------------------------------------------------------- modello */
/* Prezzo di mercato, calibrato sui prezzi realmente pagati in oltre 50.000
   acquisti delle aste 2026/27 (Fantacalcio-Online, budget 500).
   Il FVM non è un prezzo: è un tetto teorico, e i top costano molto meno
   del loro FVM perché il budget non basta. Il rapporto prezzo/FVM scende
   al crescere del FVM, da circa 1,0 sui giocatori da 1 credito a 0,20 su Malen. */
/* Il FVM più alto di ciascun reparto: è l'ancora superiore della curva. */
var FMAX = {};
["P", "D", "C", "A"].forEach(function (r) {
  FMAX[r] = PLAYERS.reduce(function (m, p) {
    return p.r === r && !p.sold && p.f > m ? p.f : m; }, 1);
});

/* Prezzo di mercato per reparto. Curva a legge di potenza ancorata in due punti:
   il giocatore col FVM più alto del reparto costa quanto hai pagato il più caro
   nella tua lega, e un FVM 1 costa 1 credito. L'esponente esce da soli quei due
   vincoli, quindi ogni reparto ha la sua pendenza: la tua lega paga i portieri
   2,7 volte il riferimento nazionale e gli attaccanti 1,7, e con un parametro
   unico quello squilibrio andrebbe perso. */
function mkt0(f, r) {
  if (f <= 0) return 1;
  if (!FMAX[r]) r = "A";                 // guardia: senza ruolo valido nessun numero inventato
  var T = (S.cfg.top && S.cfg.top[r]) || 100, M = FMAX[r] || 100;
  if (M <= 1 || T <= 1) return 1;
  var b = Math.log(T) / Math.log(M);
  return T * Math.pow(f / M, b) * (S.cfg.credits / 500);
}
/* Correzione automatica, ricalcolata a ogni acquisto registrato. Vive qui e non
   dentro mkt0 per non avere ricorsione: la aggiorna autoCal() a ogni render. */
var ADJ = { P: 1, D: 1, C: 1, A: 1 }, ADJinfo = null;
function mkt(f, r) {
  if (!FMAX[r]) r = "A";
  return Math.max(1, Math.round(mkt0(f, r) * (ADJ[r] || 1)));
}

/* I budget di reparto devono discendere dagli stessi prezzi con cui valuto i
   giocatori, altrimenti si contraddicono: con 35 crediti in porta e portieri che
   nella tua lega ne costano 76, il conto non torna e finisci per sfondare.
   Qui calcolo quanto vale, alle stime correnti, tutto ciò che la lega deve
   comprare in ogni reparto, e ripartisco il tuo budget in quella proporzione. */
function budgetSuggeriti() {
  /* Quanto costa, ai prezzi correnti, una rosa completa in ciascun reparto:
     i crediti si ripartiscono in quella proporzione. Si calcola sull'intera
     rosa e non sui soli crediti residui, perché i reparti chiamati per primi
     divorerebbero quelli chiamati per ultimi: nelle simulazioni l'attacco
     finiva con 54 crediti su 500. */
  var v = {}, tot = 0;
  ROLES.forEach(function (rr) {
    var n = S.cfg.teams * S.cfg.sl[rr.k];
    var pool = PLAYERS.filter(function (p) { return p.r === rr.k && !p.sold; })
      .map(function (p) { return mkt(p.f, p.r); })
      .sort(function (a, b) { return b - a; }).slice(0, n);
    v[rr.k] = pool.reduce(function (a, b) { return a + b; }, 0);
    tot += v[rr.k];
  });
  var out = {};
  ROLES.forEach(function (rr) {
    out[rr.k] = tot > 0 ? Math.round(v[rr.k] / tot * S.cfg.credits) : 0; });
  return out;
}
/* Il piano di spesa si fissa PRIMA di cominciare e poi non si tocca.
   Ricalcolarlo a ogni acquisto lo fa scivolare verso i reparti che in quel
   momento si stanno pagando cari — che sono spesso quelli già chiusi — e lo
   toglie a quelli dove mancano ancora giocatori. Nelle simulazioni il piano
   fisso vince 10 aste su 10, quello ricalcolato in corsa 7. Resta comunque
   modificabile a mano, e si ricalcola se cambi il regolamento o i prezzi. */
/* Il piano di spesa si fissa PRIMA che l'asta cominci e poi non si tocca.
   Ricalcolarlo mentre si compra lo fa scivolare verso i reparti che in quel
   momento si stanno pagando cari — spesso quelli già chiusi — sottraendolo a
   quelli dove mancano ancora giocatori. Nelle simulazioni il piano fisso
   vince 10 aste su 10, quello ricalcolato in corsa 7, con quasi un punto e
   mezzo di forza in più a giornata. Si ricalcola solo se cambi il regolamento
   o i prezzi di riferimento, e resta sempre modificabile a mano. */
/* Il piano si fissa in PROPORZIONI, non in cifre assolute. Le proporzioni non
   cambiano più una volta iniziata l'asta — è quella la decisione strategica, e
   ricalcolarla in corsa la fa scivolare verso i reparti già chiusi. Ma i
   crediti che avanzano da un reparto devono poter passare agli altri: se
   chiudi la porta spendendo 12 invece di 64, quei 52 non possono restare
   bloccati lì. Ogni render redistribuisco il residuo fra i reparti ancora
   aperti, rispettando le proporzioni decise all'inizio. */
function applicaBudget(forza) {
  if (!S.cfg.autoBudget) return;
  var iniziata = Object.keys(S.market).length > 0;
  if (forza || !iniziata || !S.plan) {
    var b = budgetSuggeriti(), tot = 0;
    ROLES.forEach(function (rr) { tot += b[rr.k]; });
    S.plan = {};
    ROLES.forEach(function (rr) {
      S.plan[rr.k] = tot > 0 ? b[rr.k] / tot : 0.25; });
  }
  /* quanto ho speso e quanti slot mi mancano, reparto per reparto */
  var speso = {}, presi = {}, totSpeso = 0;
  ROLES.forEach(function (rr) { speso[rr.k] = 0; presi[rr.k] = 0; });
  Object.keys(S.market).forEach(function (id) {
    if (S.market[id].o !== "me") return;
    var p = BY_ID[id];
    if (!p || speso[p.r] === undefined) return;
    speso[p.r] += S.market[id].p; presi[p.r]++; totSpeso += S.market[id].p;
  });
  /* La regola è asimmetrica, e la simulazione a 10 aste con 5 strategie
     rivali è quella che l'ha imposta.

     Se un reparto chiuso ha RISPARMIATO rispetto al piano, quell'avanzo va
     solo ai reparti NON ANCORA iniziati: darlo a uno già in corso lo fa
     spendere subito sul giocatore in trattativa in quel momento, e i
     reparti chiamati dopo restano a secco -- misurato, l'attacco finiva
     con 6 crediti su 500 e la rosa perdeva tre punti di forza a giornata.

     Se invece un reparto chiuso ha SFORATO il piano, quell'eccesso va tolto
     a TUTTI i reparti ancora aperti, compresi quelli in corso: restringere
     un tetto non innesca nessuna cascata, è solo prudenza. Senza questo lato
     della regola la somma dei budget cresceva senza controllo -- in una
     rosa completa arrivava a 662 su 500, perché lo sforamento di un reparto
     chiuso non veniva mai tolto a nessuno. */
  var pianoTot = {}, sovrasforo = 0, avanzoLibero = 0, pesiAperti = 0, pesiFuturi = 0;
  var aperti = [];
  ROLES.forEach(function (rr) {
    pianoTot[rr.k] = Math.round(S.plan[rr.k] * S.cfg.credits);
    var mancano = S.cfg.sl[rr.k] - presi[rr.k];
    if (mancano <= 0) {
      var diff = pianoTot[rr.k] - speso[rr.k];
      if (diff >= 0) avanzoLibero += diff; else sovrasforo += -diff;
    } else {
      aperti.push(rr.k);
      pesiAperti += S.plan[rr.k];
      if (presi[rr.k] === 0) pesiFuturi += S.plan[rr.k];
    }
  });
  ROLES.forEach(function (rr) {
    if (S.cfg.sl[rr.k] - presi[rr.k] <= 0) S.budgets[rr.k] = speso[rr.k];
  });

  /* I reparti aperti partono da un valore "grezzo": piano meno la loro quota
     di sforamento, più l'avanzo se non ancora iniziati. Nessun pavimento,
     per ora -- può risultare sotto lo speso, ed è proprio il caso che il
     giro seguente deve correggere senza far sparire credito nel vuoto. */
  var raw = {};
  aperti.forEach(function (k) {
    var quotaSforo = pesiAperti > 0 ? sovrasforo * S.plan[k] / pesiAperti : 0;
    var quotaAvanzo = (presi[k] === 0 && pesiFuturi > 0)
      ? avanzoLibero * S.plan[k] / pesiFuturi : 0;
    raw[k] = pianoTot[k] - quotaSforo + quotaAvanzo;
  });

  /* Nessun reparto può mostrare meno di quanto ci hai già speso -- sarebbe
     un budget negativo, incomprensibile a schermo. Dove il valore grezzo
     scende sotto lo speso, lo fisso lì e sposto il deficit sugli altri
     reparti ancora liberi, in proporzione al loro peso di piano. Fissando
     il peggiore un giro alla volta (non tutti insieme) la somma resta
     sempre esatta: senza questo passaggio, il credito che un reparto non
     può "restituire" perché è già al minimo spariva senza essere tolto a
     nessun altro, ed è la causa della somma che cresceva senza controllo. */
  var fissato = {}, liberi = aperti.slice();
  for (var giro = 0; giro <= aperti.length; giro++) {
    var peggioreK = null, peggioreDeficit = 0;
    liberi.forEach(function (k) {
      var deficit = speso[k] - raw[k];
      if (deficit > peggioreDeficit) { peggioreDeficit = deficit; peggioreK = k; }
    });
    if (!peggioreK) break;
    fissato[peggioreK] = speso[peggioreK];
    liberi = liberi.filter(function (k) { return k !== peggioreK; });
    var pesiRimasti = liberi.reduce(function (a, k) { return a + S.plan[k]; }, 0);
    liberi.forEach(function (k) {
      raw[k] -= pesiRimasti > 0 ? peggioreDeficit * S.plan[k] / pesiRimasti : 0;
    });
  }
  aperti.forEach(function (k) {
    S.budgets[k] = fissato[k] !== undefined ? fissato[k] : Math.round(raw[k]);
  });
}

/* L'automatismo si regge su un vincolo semplice: il denaro della lega è fissato.
   Sono squadre x crediti, punto. Quindi se sui portieri si è speso più del previsto,
   per i reparti ancora da chiamare resta meno, e i tetti là devono SCENDERE.
   Un automatismo che si limitasse a rincorrere i prezzi al rialzo farebbe il
   contrario di quello che serve: inseguirebbe il mercato invece di proteggerti. */
function autoCal() {
  ADJ = { P: 1, D: 1, C: 1, A: 1 }; ADJinfo = null;
  if (!S.cfg.auto) return;

  var ids = Object.keys(S.market);
  if (!ids.length) return;

  var totale = S.cfg.teams * S.cfg.credits, speso = 0;
  var venduti = { P: 0, D: 0, C: 0, A: 0 }, oss = { P: [], D: [], C: [], A: [] };
  ids.forEach(function (id) {
    var p = BY_ID[id], m = mkt0(p.f, p.r);
    speso += S.market[id].p;
    venduti[p.r]++;
    if (m > 0.5) oss[p.r].push(S.market[id].p / m);
  });

  /* quanto varrebbe, alle stime attuali, tutto quello che la lega deve ancora comprare */
  var resta = totale - speso, servono = 0;
  ROLES.forEach(function (rr) {
    var n = Math.max(0, S.cfg.teams * S.cfg.sl[rr.k] - venduti[rr.k]);
    var pool = PLAYERS.filter(function (p) {
        return p.r === rr.k && !S.market[p.id] && !p.sold; })
      .map(function (p) { return mkt0(p.f, p.r); })
      .sort(function (a, b) { return b - a; }).slice(0, n);
    servono += pool.reduce(function (a, b) { return a + b; }, 0);
  });
  if (servono <= 0) return;

  var k = Math.max(0.6, Math.min(1.6, resta / servono));

  function med(a) {
    if (a.length < 4) return null;
    var b = a.slice().sort(function (x, y) { return x - y; });
    var h = Math.floor(b.length / 2);
    return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2;
  }
  /* reparto già in corso: uso i prezzi che si stanno facendo davvero.
     reparto non ancora aperto: uso quanto denaro resta in circolazione. */
  ROLES.forEach(function (rr) {
    var o = med(oss[rr.k]);
    ADJ[rr.k] = Math.max(0.6, Math.min(1.6, o !== null ? o : k));
  });
  ADJinfo = { k: k, resta: resta, servono: Math.round(servono), n: ids.length };
}

/* Le regole della lega spostano il valore di alcuni ruoli.
   I prezzi di riferimento vengono da una lega col modificatore attivo:
   quindi il modificatore è già dentro, e lo tolgo solo se lo spegni. */
function ruleF(p) {
  var k = 1;
  if (!S.cfg.moddif) k *= p.r === "P" ? 0.88 : p.r === "D" ? 0.94 : 1;
  /* senza bonus assist perdono soprattutto esterni e rifinitori */
  if (!S.cfg.assist && /E|W|T/.test(p.rm || "")) k *= 0.88;
  return k;
}
/* Il tetto sta un filo sopra la mediana di mercato: oltre stai pagando caro. */
/* Il secondo parametro non è opzionale: senza di esso il ruolo verrebbe scelto
   d'arbitrio e il prezzo sarebbe di un altro reparto. Meglio accorgersene subito. */
function cap(f, p) {
  if (!p || !p.r) throw new Error("cap(): manca il giocatore, il ruolo serve al prezzo");
  return Math.max(1, Math.round(mkt(f, p.r) * 1.15 * ruleF(p)));
}
function exp2(f, r) { var m = mkt(f, r || "A");
  return [Math.max(1, Math.round(m * 0.85)), Math.max(2, Math.round(m * 1.15))]; }
function alts(p) { return PLAYERS.filter(function (o) {
  return o.r === p.r && o.id !== p.id && !S.market[o.id] && !o.sold && o.f >= p.f * .75;
}).length; }
/* Il FVM considera solo in parte il rischio panchina: un 50% costa quasi come un
   titolare. Correggo il tetto senza azzerarlo, per non pagare da titolare chi non lo è. */
function titF(p) {
  if (!S.cfg.tcorr) return 1;                // correzione disattivata dall'utente
  if (!p.tit) return 1;                      // dato assente: non invento uno sconto
  return Math.min(1, 0.55 + 0.45 * (p.tit / 95));
}
/* Chi rientra alla giornata N salta N-1 partite su 38: il tetto scende in proporzione.
   inj = -1 nessun problema, 0 segnalato ma senza data dichiarata. */
function injF(p) {
  if (p.inj === undefined || p.inj < 0) return 1;
  if (p.inj === 0) return 0.9;               // segnalazione senza data: sconto prudenziale
  return Math.max(0.3, 1 - (p.inj - 1) / 38);
}
function capT(p) { return Math.max(1, Math.round(cap(p.f, p) * titF(p) * injF(p))); }

/* Il tetto che conta davvero: valore di mercato corretto per titolarità e
   infortuni, moltiplicato per l'indice di scarsità, e poi limitato da quanto
   resta nel reparto e da quanto puoi materialmente offrire. Prima l'elenco
   mostrava il solo valore di mercato e la scheda questo: due numeri diversi
   per lo stesso giocatore, con scarti fino al 31%. Ora è uno solo. */
function tettoOp(p, d) {
  d = d || calc();
  var R = d.per[p.r];
  if (!R || R.need <= 0) return capT(p);          // reparto pieno: resta il valore
  var u = urg(alts(p), R.need);
  var valore = Math.max(1, Math.round(cap(p.f, p) * u.k * titF(p) * injF(p)));
  var quota = Math.max(1, R.left - Math.max(0, R.need - 1));
  return Math.max(1, Math.min(valore, quota, d.max));
}

/* S = slot mancanti / occasioni disponibili a quel livello */
function urg(a, need) {
  if (need <= 0) return { k: 0, s: 0, l: "Reparto completo" };
  var s = need / (a + 1);
  if (s <= .20) return { k: .85, s: s, l: "Abbondanza" };
  if (s <= .40) return { k: .92, s: s, l: "Comodo" };
  if (s <= .60) return { k: 1.0, s: s, l: "Equilibrio" };
  if (s <= .80) return { k: 1.10, s: s, l: "Tensione" };
  if (s < 1)    return { k: 1.18, s: s, l: "Allarme" };
  return { k: 1.30, s: s, l: "Ultima occasione" }; }
/* tabella ufficiale del modificatore difesa, applicata alla media voto proiettata */
function modLbl(a) { return a >= 7 ? "+5" : a >= 6.75 ? "+4" : a >= 6.5 ? "+3"
                          : a >= 6.25 ? "+2" : a >= 6 ? "+1" : "0"; }
/* griglia: quante giornate resti senza un portiere in casa */
function pairVal(a, b) { return (GRID[a] && typeof GRID[a][b] === "number") ? GRID[a][b] : null; }
function pairLbl(v) { return v <= 3 ? ["Perfetto", "var(--ok)"] : v <= 7 ? ["Buono", "var(--ok)"]
                          : v <= 11 ? ["Medio", "var(--warn)"] : ["Scarso", "var(--bad)"]; }

function calc() {
  var mine = Object.keys(S.market).filter(function (i) { return S.market[i].o === "me"; });
  var spent = mine.reduce(function (s, i) { return s + S.market[i].p; }, 0);
  var credits = START() - spent, left = SLOTS() - mine.length;
  var per = {};
  ROLES.forEach(function (r) {
    var L = mine.filter(function (i) { return BY_ID[i].r === r.k; })
      .map(function (i) { var p = Object.assign({}, BY_ID[i]); p.price = S.market[i].p; return p; })
      .sort(function (a, b) { return b.f - a.f; });
    var sp = L.reduce(function (s, p) { return s + p.price; }, 0);
    per[r.k] = { r: r, L: L, spent: sp, need: S.cfg.sl[r.k] - L.length,
                 left: S.budgets[r.k] - sp };
  });
  /* una scheda per ogni avversario, più il calderone "non so" */
  var riv = S.riv.map(function (nm, i) {
    var ids = Object.keys(S.market).filter(function (x) { return S.market[x].o === "r" + i; });
    var sp2 = ids.reduce(function (a, x) { return a + S.market[x].p; }, 0);
    var sl = SLOTS() - ids.length, cr = START() - sp2;
    return { i: i, name: nm, ids: ids, spent: sp2, credits: cr, slots: sl,
             max: Math.max(0, cr - Math.max(0, sl - 1)) };
  });
  var unk = Object.keys(S.market).filter(function (x) { return S.market[x].o === "x"; });
  var unkSp = unk.reduce(function (a, x) { return a + S.market[x].p; }, 0);
  /* se non hai assegnato tutto, la media si corregge con gli acquisti non attribuiti */
  var totRiv = riv.reduce(function (a, r) { return a + r.credits; }, 0) - unkSp;
  var avg = Math.round(totRiv / Math.max(1, TEAMS_N() - 1));

  var mod = null, gk = per.P.L[0];
  var ds = per.D.L.slice().sort(function (a, b) { return pmv(b) - pmv(a); }).slice(0, 3);
  if (gk && ds.length === 3) {
    var vs = [pmv(gk)].concat(ds.map(pmv));
    var av = vs.reduce(function (a, b) { return a + b; }, 0) / 4;
    var cl = [gk.t].concat(ds.map(function (d) { return d.t; }));
    mod = { gk: gk, ds: ds, av: av, l: modLbl(av),
            dup: cl.some(function (c) { return cl.filter(function (x) { return x === c; }).length >= 3; }) };
  }
  /* left negativo (rosa sforata, o slot ridotti dal Setup dopo gli acquisti)
     azzererebbe la riserva e renderebbe l'offerta massima pari ai crediti. */
  var leftPos = Math.max(0, left);
  return { mine: mine, spent: spent, credits: credits, left: left,
           max: leftPos > 0 ? Math.max(0, credits - (leftPos - 1)) : 0,
           per: per, res: avg > 0 ? credits / avg : 1, mod: mod,
           riv: riv, unk: unk.length, unkSp: unkSp };
}

function wrappedStats() {
  var mine = Object.keys(S.market).filter(function (id) { return S.market[id].o === "me"; })
    .map(function (id) { return { p: BY_ID[id], price: S.market[id].p,
                                   m: mkt0(BY_ID[id].f, BY_ID[id].r) }; });
  if (!mine.length) return null;
  var conRatio = mine.map(function (x) {
    return { p: x.p, price: x.price, m: x.m, ratio: x.price / Math.max(1, x.m) }; });
  var colpaccio = conRatio.slice().sort(function (a, b) { return a.ratio - b.ratio; })[0];
  var peggiore = conRatio.slice().sort(function (a, b) { return b.ratio - a.ratio; })[0];
  var speso = mine.reduce(function (a, x) { return a + x.price; }, 0);
  var tutti = Object.keys(S.market).map(function (id) {
    return { p: S.market[id].p, o: S.market[id].o, n: BY_ID[id].n }; });
  var sceicco = tutti.slice().sort(function (a, b) { return b.p - a.p; })[0];

           sceicco: sceicco, sceiccoDi: sceiccoDi };
}
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

    '<div class="rcap" style="left:' + pct(rec, SC) + '%"></div>' +

/* Cosa manca per salire di uno scalino: la domanda che il pannello non sapeva rispondere */
function modHint(d) {
  var m = d.mod, TH = [6, 6.25, 6.5, 6.75, 7];
  var next = null;
  for (var i = 0; i < TH.length; i++) if (m.av < TH[i]) { next = TH[i]; break; }
  if (next === null)
    return '<p class="note" style="margin-top:9px">Sei al massimo dello scalino: ' +
      "il +5 richiede 7,00 di media e nessuno ci arriva.</p>";

  var vals = [pmv(m.gk)].concat(m.ds.map(pmv));
  var worst = Math.min.apply(null, m.ds.map(pmv));
  var sum = vals.reduce(function (a, b) { return a + b; }, 0);
  var needD = 4 * next - (sum - worst);          // MV che dovrebbe avere il sostituto
  var needP = 4 * next - (sum - vals[0]);        // oppure un portiere migliore

  function pool(role, mv) {
    return PLAYERS.filter(function (p) {
      return p.r === role && !S.market[p.id] && !p.sold && p.tit >= 75 && pmv(p) >= mv;
    }).sort(function (a, b) { return capT(a) - capT(b); });
  }
  var cd = pool("D", needD), cp = pool("P", needP);
  var lbl = next >= 7 ? "+5" : next >= 6.75 ? "+4" : next >= 6.5 ? "+3" : next >= 6.25 ? "+2" : "+1";

  var h = '<p class="note" style="margin-top:9px">Per il <b>' + lbl + "</b> serve una media di " +
    next.toFixed(2) + " (ti manca " + (next - m.av).toFixed(2) + "). ";
  if (!cd.length && !cp.length)
    return h + "Nessun portiere o difensore ancora libero basterebbe: questo scalino è chiuso.</p>";
  if (cd.length)
    h += "Sostituendo il tuo difensore più debole serve uno da <b>" + needD.toFixed(2) +
      "</b> di media: il più economico libero è <b>" + esc(cd[0].n) + "</b> (" + cd[0].t +
      ", " + capT(cd[0]) + " fm). ";
  if (cp.length && needP <= 6.6)
    h += "In alternativa un portiere da " + needP.toFixed(2) + ": " + esc(cp[0].n) +
      " (" + capT(cp[0]) + " fm).";
  return h + "</p>";
}

/* Andamento dell'asta: confronto ogni prezzo pagato — mio o altrui — con la
   stima di mercato, e ne tengo la mediana. Sopra 1 la lega sta strapagando.
   Uso la mediana e non la media perché un singolo colpo di testa non deve
   spostare il termometro. Servono almeno 4 acquisti per dire qualcosa. */
function trend() {
  var per = { P: [], D: [], C: [], A: [] }, all = [];
  Object.keys(S.market).forEach(function (id) {
    var p = BY_ID[id], m = mkt0(p.f, p.r);
    if (!(m > 0.5)) return;
    var q = S.market[id].p / m;
    per[p.r].push(q); all.push(q);
  });
  function med(a) {
    if (!a.length) return null;
    var b = a.slice().sort(function (x, y) { return x - y; });
    var h = Math.floor(b.length / 2);
    return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2;
  }
  var o = { tot: { n: all.length, q: med(all) } };
  ["P", "D", "C", "A"].forEach(function (r) {
    o[r] = { n: per[r].length, q: med(per[r]) }; });
  return o;
}
function trendLbl(q) {
  if (q === null) return ["dati insufficienti", "var(--dim2)"];
  var d = Math.round((q - 1) * 100);
  if (d >= 15) return ["si sta strapagando, " + d + "% sopra", "var(--bad)"];
  if (d >= 6) return ["un po' sopra, +" + d + "%", "var(--warn)"];
  if (d <= -15) return ["si compra bene, " + d + "% sotto", "var(--ok)"];
  if (d <= -6) return ["un po' sotto, " + d + "%", "var(--ok)"];
  return ["in linea con le stime", "var(--key)"];
}

    "la percentuale resta visibile accanto a ogni nome, per valutare caso per caso.</p></div>";

  h += '<div class="card"><h3>Backup dell\'asta</h3>' +
    '<p class="tiny" style="margin-bottom:10px">I dati vivono solo su questo dispositivo. ' +
    "Copia questo testo e incollalo in una nota o mandatelo su WhatsApp: se il telefono si " +
    "spegne o si azzera, lo reincolli qui sotto e riprendi da dove eri.</p>" +
    '<textarea class="bk" id="bk" readonly onclick="this.select()">' +
    esc(JSON.stringify(S)) + "</textarea>" +
    '<div class="acts" style="margin-top:9px">' +
    '<button class="other" onclick="_a.copy()">Copia backup</button>' +
    '<button class="other" onclick="_a.paste()">Ripristina…</button></div></div>';

  var nonAss = Object.values(S.market).filter(function (m) { return m.o === "x"; }).length;
  h += '<div class="card"><h3>Esporta le rose</h3>' +
    '<p class="tiny" style="margin-bottom:10px">Nome, ruolo, squadra e prezzo di ogni giocatore. ' +
    "Su <b>Leghe Fantacalcio.it</b> si carica in Squadre → Importa le rose da un foglio (piano PRO): " +
    "bastano nome del calciatore e fantasquadra, il resto aiuta il riconoscimento. Non ho trovato " +
    "un'importazione equivalente su FantaMaster: lì l'inserimento resta manuale, ma il file resta " +
    "comunque un elenco pronto da cui copiare.</p>" +
    (nonAss ? '<p class="flag" style="margin-bottom:9px">' + nonAss +
      ' acquisti non assegnati a nessuna squadra: nell\'esportazione completa restano "Non assegnato".</p>' : "") +
    '<div class="acts"><button class="other" onclick="_a.exportCSV(false)">La mia rosa</button>' +
    '<button class="other" onclick="_a.exportCSV(true)">Tutta l\'asta (CSV)</button></div>' +
    '<button class="other" style="width:100%;margin-top:8px" onclick="_a.exportJSON()">Tutta l\'asta (JSON)</button>' +
    "</div>";

  h += '<div class="card"><h3>Ricomincia</h3>' +
    '<p class="tiny" style="margin-bottom:10px">Azzera rosa, acquisti e obiettivi. ' +
    "La configurazione della lega resta.</p>" +
    '<button class="danger" onclick="_a.reset()">Azzera l\'asta</button></div>';
  return h;
}

/* ---------------------------------------------------------------- rivali */
function vRiv(d) {
  var ord = d.riv.slice().sort(function (a, b) { return b.max - a.max; });
  var h = '<p class="tiny" style="margin:0 0 12px">Ogni volta che registri un acquisto ' +
    "altrui puoi assegnarlo a una squadra. <b>Offerta max</b> è quanto può ancora spingersi " +
    "quella squadra: crediti − (slot − 1). È il numero che decide fin dove ti conviene rilanciare.</p>";
  if (d.unk)
    h += '<p class="flag">' + d.unk + " acquisti registrati senza squadra (" + d.unkSp +
      " fm). Le cifre qui sotto restano indicative finché non li assegni.</p>";

  h += ord.map(function (r) {
    var danger = r.max > d.max;
    return '<div class="card" style="padding:12px">' +
      '<div class="rhead"><input class="rvname" value="' + esc(r.name) +
      '" onchange="_a.rename(' + r.i + ',this.value)">' +
      '<span class="rvmax" style="color:' + (danger ? "var(--bad)" : "var(--dim)") + '">' +
      r.max + ' <span class="cap">max</span></span></div>' +
      '<div class="rvbar"><i style="width:' + pct(r.spent, START()) + '%"></i></div>' +
      '<div class="rvnums"><span>' + r.credits + ' <span class="cap">crediti</span></span>' +
      "<span>" + r.slots + ' <span class="cap">slot</span></span>' +
      "<span>" + (SLOTS() - r.slots) + ' <span class="cap">presi</span></span></div>' +
      (r.ids.length ? '<div class="rvlist">' + r.ids.map(function (x) {
        return '<span><b class="b-' + BY_ID[x].r + '">' + BY_ID[x].r + "</b> " +
          esc(BY_ID[x].n) + " <i>" + S.market[x].p + "</i></span>"; }).join("") + "</div>" : "") +
      "</div>"; }).join("");
  return h;
}

/* ------------------------------------------------------------- chi resta */
function vLista(d) {
  var h = '<p class="tiny" style="margin:0 0 12px">Chi è ancora libero. Finché le alternative ' +
    "sono tante puoi permetterti di dire di no. La prima percentuale è la titolarità attesa, " +
    "il numero dopo è il tetto in crediti. <b>R</b> segnala il rigorista.</p>";
  ROLES.forEach(function (r) {
    var av = PLAYERS.filter(function (p) { return p.r === r.k && !S.market[p.id] && !p.sold; })
      .sort(function (a, b) { return b.f - a.f; });
    var B = [["Top", av.filter(function (p) { return p.f >= 80; })],
             ["Semi-top", av.filter(function (p) { return p.f >= 35 && p.f < 80; })],
             ["Titolari", av.filter(function (p) { return p.f >= 15 && p.f < 35; })],
             ["Scommesse", av.filter(function (p) { return p.f < 15; })]];
    h += '<div class="card"><div class="rhead"><div class="lft">' +
      '<span class="badge b-' + r.k + '">' + r.k + '</span><h3 style=margin:0>' + r.l + "</h3></div>" +
      '<span class="cap">ti mancano ' + d.per[r.k].need + " slot</span></div>";
    B.forEach(function (b) {
      h += '<div class="band"><div class="h" style="color:var(--' + r.k + ')">' + b[0] +
        " · " + b[1].length + ' liberi</div><div class="b">' +
        (b[1].length ? b[1].slice(0, openBand[r.k + b[0]] ? 999 : 14).map(function (p) {
          return '<button onclick="_a.pick(\'' + p.id + '\')">' + esc(p.n) +
            (p.sp.indexOf("R") >= 0 ? '<span class="sp">R</span>' : "") +
            ' <span class="q" style="color:' + titCol(p.tit) + '">' + (p.tit || "?") + "%</span>" +
            ' <span class="q">' + tettoOp(p, d) + "</span></button>"; }).join(" · ") +
          (b[1].length > 14 && !openBand[r.k + b[0]]
            ? ' <button class="more" onclick="_a.band(\'' + r.k + b[0] + '\')">+' +
              (b[1].length - 14) + " altri</button>" : "")
        : '<span style="color:var(--dim2)">nessuno</span>') + "</div></div>";
    });
    h += "</div>";
  });
  return h;
}

/* ------------------------------------------------------------- infortuni */
function vInf(d) {
  var L = PLAYERS.filter(function (p) { return p.inj >= 0 && !p.sold; })
    .sort(function (a, b) { return (b.inj || 99) - (a.inj || 99) || b.f - a.f; });
  var h = '<p class="tiny" style="margin:0 0 12px">Indisponibili e squalificati, dalla ' +
    "assenza più lunga alla più breve. La giornata indicata è la <b>prima possibile</b> per " +
    "il rientro, non una certezza: sugli interventi chirurgici slitta spesso. Il tetto di " +
    "questi giocatori è già ridotto in proporzione alle partite che saltano.</p>";
  var last = null;
  L.forEach(function (p) {
    var grp = p.inj === 0 ? "Senza data dichiarata"
            : p.inj >= 9 ? "Lungodegenti — oltre due mesi"
            : p.inj >= 5 ? "Assenze medie — un mese circa"
            : "Assenze brevi";
    if (grp !== last) { h += '<h3 style="margin:14px 0 7px;color:var(--key)">' + grp + "</h3>"; last = grp; }
    h += '<div class="card" style="padding:11px;margin-bottom:7px">' +
      '<div class="rhead" style="margin-bottom:5px"><div class="lft">' +
      '<span class="badge b-' + p.r + '">' + p.r + "</span>" +
      "<b>" + esc(p.n) + '</b> <span style="color:var(--dim2);font-size:13px">' + esc(p.t) +
      "</span></div>" +
      '<span class="inj">' + (p.inj > 0 ? p.inj + "ª giornata" : "data ignota") + "</span></div>" +
      '<p class="tiny">' + esc(p.injx) + "</p>" +
      '<p class="tiny" style="margin-top:4px">Tetto pieno ' + cap(p.f, p) + " fm → corretto <b>" +
      capT(p) + '</b> fm · <button class="more" onclick="_a.pick(\'' + p.id +
      '\')">apri</button></p></div>';
  });
  h += '<p class="tiny" style="margin-top:14px">Dati incrociati fra la tabella indisponibili ' +
    "di SOS Fanta del 28 agosto, FantaCalcioPedia e le testate sportive. Verificali il giorno " +
    "dell'asta: cambiano di ora in ora.</p>";
  return h;
}

/* -------------------------------------------------------- griglia portieri */
function vGk(d) {
  var mio = d.per.P.L[0];
  var base = gkPick || (mio ? mio.c : "");
  var teams = Object.keys(GRID).sort();
  var opts = teams.map(function (t) {
    return '<option value="' + t + '"' + (t === base ? " selected" : "") + ">" + t + "</option>"; }).join("");

  var h = '<div class="card"><h3>Griglia portieri</h3>' +
    '<p class="tiny" style="margin-bottom:11px">Dato ufficiale: in quante delle 38 giornate ' +
    "i due portieri giocano <b>in casa nello stesso turno</b>. Sono giornate sprecate, perché ne " +
    "schieri uno solo — e sono esattamente le stesse in cui poi restano fuori casa entrambi. " +
    "Più basso è meglio.</p>" +
    '<select class="sel" onchange="_a.gk(this.value)">' + opts + "</select>";

  if (base && GRID[base]) {
    var L = Object.keys(GRID[base]).filter(function (t) { return t !== base; })
      .map(function (t) { return [t, GRID[base][t]]; })
      .sort(function (a, b) { return a[1] - b[1]; });
    h += '<div class="pairs">' + L.slice(0, 10).map(function (x) {
      var q = pairLbl(x[1]);
      return '<div class="pair"><span class="q" style="background:' + q[1] + '">' + x[1] + "</span>" +
        '<span class="g"><b>' + base + " + " + x[0] + '</b><br><span class="lbl">' + q[0] +
        "</span></span></div>"; }).join("") + "</div>";
    var worst = L[L.length - 1];
    h += '<p class="tiny" style="margin-top:11px">Da evitare con ' + base + ": <b>" + worst[0] +
      "</b> (" + worst[1] + " giornate scoperte).</p>";
  }
  h += "</div>";

  h += '<div class="card"><h3>Le tre coppie perfette</h3><div class="pairs">' +
    [["Rom", "Laz"], ["Int", "Mil"], ["Tor", "Juv"]].map(function (x) {
      return '<div class="pair"><span class="q" style="background:var(--ok)">0</span>' +
        '<span class="g"><b>' + x[0] + " + " + x[1] + '</b><br><span class="lbl">' +
        "Non giocano mai in casa nello stesso turno</span></span></div>"; }).join("") + "</div>" +
    '<p class="tiny" style="margin-top:10px">Le tre coppie di squadre della stessa città: il ' +
    "calendario le alterna sempre. Se prendi due portieri qui, hai un titolare in casa tutte " +
    "le 38 giornate.</p></div>";

  if (mio) {
    var free = PLAYERS.filter(function (p) { return p.r === "P" && !S.market[p.id] && !p.sold && p.f >= 8; })
      .map(function (p) { return [p, pairVal(mio.c, p.c)]; })
      .filter(function (x) { return x[1] !== null; })
      .sort(function (a, b) { return a[1] - b[1] || b[0].f - a[0].f; }).slice(0, 12);
    h += '<div class="card"><h3>Vice consigliati per ' + esc(mio.n) + "</h3>" +
      '<div class="pairs">' + free.map(function (x) {
        var q = pairLbl(x[1]);
        return '<div class="pair"><span class="q" style="background:' + q[1] + '">' + x[1] + "</span>" +
          '<span class="g"><b>' + esc(x[0].n) + '</b><br><span class="lbl">' + esc(x[0].t) +
          " · tetto " + tettoOp(x[0], d) + " fm</span></span>" +
          '<button class="other" style="padding:7px 11px;border-radius:7px;font-size:13px" ' +
          'onclick="_a.pick(\'' + x[0].id + '\')">Apri</button></div>'; }).join("") + "</div></div>";
  }
  return h;
}

/* ------------------------------------------------------------------ info */
function vInfo() {
  var C = [
    ["Come si legge il righello",
     "La banda chiara è il prezzo che il giocatore dovrebbe fare sul mercato. La linea azzurra è " +
     "il tuo tetto, la rossa il massimo che puoi materialmente offrire. Il cursore è l'offerta " +
     "sul banco: finché resta a sinistra dell'azzurro stai comprando bene."],
    ["Da dove esce il tetto",
     "<b>Non dal FVM diviso due</b>: quello era un errore. Il FVM è un massimo teorico, e nelle aste " +
     "vere i campioni costano molto meno. Il prezzo base viene da una curva calibrata sui prezzi " +
     "realmente pagati in oltre 50.000 acquisti di questa stagione: Lautaro va in mediana a 84 " +
     "crediti su 500, non a 184 — quella però è la mediana nazionale. La scala si tara poi sulla " +
     "tua lega, col prezzo del più caro di ogni reparto che imposti nel Setup: la tua paga circa " +
     "<b>1,7 volte la media nazionale</b> sui campioni, quindi i numeri che vedi sono più alti. " +
     "Sopra questo agiscono l'indice di scarsità, la titolarità, gli infortuni e le regole."],
    ["Offerta massima",
     "Devi completare tutti gli slot della rosa e tenere 1 credito per ognuno di quelli ancora " +
     "vuoti: <b>crediti − (slot − 1)</b>. " +
     "Vale anche per gli avversari: se sai quanti slot gli mancano, sai fin dove possono spingersi."],
    ["Indice di riserva",
     "I tuoi crediti diviso la media avversaria, calcolata sugli acquisti che registri. <b>Sopra 1,10</b> " +
     "sei in vantaggio e puoi aggredire. <b>Sotto 0,90</b> hai speso troppo presto: chiudi gli slot a " +
     "1–5 crediti e non rincorrere."],
    ["Modificatore difesa",
     "Media voto di <b>portiere più i 3 migliori difensori</b>. Ogni punto vale circa 7,6 gol a " +
     "stagione. Attenzione però a quanto è davvero raggiungibile: il <b>+3 chiede una media di " +
     "6,50</b> e in tutto il listone un solo difensore ci arriva da solo, nessun portiere. Il " +
     "salto realistico è da +1 a +2, e costa una sessantina di crediti scegliendo bene. Servono " +
     "centrali da voto alto per la media e terzini da bonus in slot separati, su squadre " +
     "diverse: quattro giocatori della stessa difesa crollano tutti insieme."],
    ["Titolarità",
     "La percentuale sotto ogni nome è la titolarità attesa secondo FantaLab. È il dato più " +
     "importante della scheda: un giocatore al 25% vale una frazione del suo FVM, perché il " +
     "tetto presuppone che giochi. <b>Verde sopra il 75%, rosso sotto il 50%</b>. " +
     "Chi è dato al 50% vale il 21% in meno, chi è al 25% un terzo in meno: una correzione " +
     "parziale, perché il FVM tiene già conto in parte del rischio panchina. Se non ti convince " +
     "la spegni dal Setup e i tetti tornano pieni, con la percentuale sempre in vista."],
    ["Rigoristi e piazzati",
     "Le sigle R, P e C accanto al nome segnalano rigorista, tiratore di punizioni e di calci " +
     "d'angolo. Il rigore è il bonus a <b>varianza più bassa</b> che esista: a parità di FVM, il " +
     "rigorista vale sempre più dell'altro."],
    ["Il piano di spesa",
     "La ripartizione fra porta, difesa, centrocampo e attacco si fissa <b>prima</b> che l'asta " +
     "cominci e poi non si muove più: è la decisione strategica, e ricalcolarla mentre compri la " +
     "farebbe scivolare verso i reparti già chiusi. Le cifre però respirano: se chiudi la porta " +
     "spendendo meno del previsto, l'avanzo passa ai reparti <b>non ancora chiamati</b>. " +
     "Sistema regolamento e prezzi nel Setup prima di iniziare, perché è lì che il piano nasce."],
    ["Ritaratura automatica",
     "I tetti invece si muovono per tutta l'asta. Sul reparto in corso seguono i prezzi che si " +
     "stanno facendo davvero, perché se resti sotto il mercato non compri nessuno. Sui reparti " +
     "non ancora aperti guardano <b>quanto denaro resta in circolazione</b>: se la lega ha " +
     "strapagato i portieri, per gli attaccanti ci saranno meno soldi e i tetti scendono in " +
     "anticipo. La correzione non supera mai il 40% in nessuna direzione."],
    ["Ritmo di spesa",
     "Se riempi gli slot molto più in fretta di quanto spendi, finirai con la cassa piena e una " +
     "rosa scadente: <b>i crediti avanzati valgono zero</b>. L'app confronta la quota di rosa " +
     "completata con la quota di budget usata e ti avvisa quando divergono di oltre un quarto, " +
     "in entrambe le direzioni."],
    ["Squadre rivali",
     "Quando registri un acquisto altrui puoi assegnarlo alla squadra che l'ha preso. La scheda " +
     "Rivali calcola per ognuna crediti residui, slot mancanti e offerta massima. Se un " +
     "avversario non può superare i 40 fm, sai che a 41 il giocatore è tuo."],
    ["Griglia portieri",
     "Il numero ufficiale conta le <b>giornate sprecate</b>: quelle in cui i due portieri giocano in casa insieme, " +
     "perché ne schieri uno solo. Roma+Lazio, Inter+Milan e Torino+Juventus stanno a zero, perché " +
     "il calendario alterna le squadre della stessa città. All'opposto Napoli+Lazio arriva a 16."]
  ];
  return '<div class="guide">' + C.map(function (x) {
    return '<div class="card"><h3>' + x[0] + "</h3><p>" + x[1] + "</p></div>"; }).join("") +
    '<div class="card"><p class="tiny">Dati dai quattro file che mi hai fornito: quotazioni ' +
    "Fantacalcio.it (520 acquistabili + 36 ceduti), statistiche di campionato, griglia portieri " +
    "e guida FantaLab del 28/08/2026 (titolarità, medie attese, rigoristi, piazzati, " +
    "ballottaggi, moduli). Questi sono dati di fonte. Sono invece stime calcolate da me: i " +
    "tetti, le fasce di prezzo, l'indice di scarsità e il modificatore atteso. " +
    "Tutto resta su questo dispositivo.</p></div></div>";
}

/* ---------------------------------------------------------------- render */
function R() {
  autoCal();        // prima: calcola ADJ, che non dipende dai budget
  applicaBudget();  // poi: i budget si appoggiano ai prezzi già corretti
  var d = calc();
  checkAlerts(d);
  head(d);
  var h = tab === "asta" ? vAsta(d) : tab === "rosa" ? vRosa(d) :
          tab === "obb" ? vObb(d) : tab === "riv" ? vRiv(d) :
          tab === "lista" ? vLista(d) : tab === "inf" ? vInf(d) : tab === "gk" ? vGk(d) :
          tab === "set" ? vSet(d) : vInfo();
  if (!storeOk) h = '<p class="flag" style="margin:0 0 12px">Il salvataggio automatico non ' +
    "risponde. Non chiudere questa scheda finché l'asta non è finita.</p>" + h;
  E("app").innerHTML = toastsHTML() + h + wrappedOverlay();
  if (wrappedOpen) drawWrapped();   // il canvas esiste solo dopo aver scritto innerHTML

  var q = E("q");
  if (q) q.addEventListener("input", function () {
    /* calc() gira su tutti i giocatori: senza attesa lo rifarebbe a ogni tasto.
       Ridisegno solo #res, non l'intera pagina. */
    var v = this.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      query = v; limit = 60;
      var r = E("res");
      if (r) r.innerHTML = rows(calc());
    }, 180);
  });
  var b = E("bid");
  if (b) b.addEventListener("input", function () {
    bid = Math.max(0, parseInt(this.value) || 0);
    var pos = b.selectionStart; R();
    var n = E("bid"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
  });
}
/* dialogo con la finestra ospite: chiedo lo stato salvato e lo applico */
function applyState(v) {
  if (!v) return;
  try {
    var o = JSON.parse(v);
    if (!o || !o.market) return;
    S.market = o.market || {}; S.targets = o.targets || {};
    if (o.cfg) S.cfg = o.cfg;
    if (o.budgets) S.budgets = o.budgets;
    if (o.riv) S.riv = o.riv;
    fillRiv(); R();
  } catch (e) {}
}
if (BRIDGE) {
  addEventListener("message", function (e) {
    if (e.data && e.data.t === "restore") { applyState(e.data.v); storeOk = true; }
  });
  try { parent.postMessage({ t: "ready" }, "*"); } catch (e) {}
  storeOk = true;   // il salvataggio lo gestisce la finestra ospite
}

R();

/* Tolgo l'avvio dopo il primo disegno, ma non prima di 550 ms: su un telefono
   veloce sparirebbe in un lampo dando l'impressione di uno sfarfallio. Un tocco
   lo salta subito, e se qualcosa andasse storto un timer di sicurezza lo rimuove
   comunque: non deve mai poter restare bloccato sopra l'app. */
(function () {
  var sp = document.getElementById("splash");
  if (!sp) return;
  var tolto = false;
  function via() {
    if (tolto) return;
    tolto = true;
    sp.className = "via";
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
  }
  sp.addEventListener("click", via);
  setTimeout(via, 550);
  setTimeout(via, 4000);   // rete di sicurezza
})();
</script>
